services:
  app:
    build:
      context: .
      target: production
    image: notes-crud-api:1.0
    container_name: notes-crud-api
    ports:
      - "5000:8080"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: notesdb
      DB_USER: notesuser
      DB_PASSWORD: notespassword
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  db:
    image: mariadb:11.4
    container_name: notes-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: notesdb
      MARIADB_USER: notesuser
      MARIADB_PASSWORD: notespassword
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  mariadb_data: